name: Code checks (no private datasets)
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-data.txt
      - run: python -m pytest -q
      # Private BAF data is never placed in the repository or CI.
